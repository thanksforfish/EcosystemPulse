name: Build and Deploy EcosystemPulse

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/history/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "ecosystempulse-${{ github.ref }}"
  cancel-in-progress: false

env:
  SITE_URL: https://ecosystempulse.dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect data, preserve history, and generate pages
        run: python run.py

      - name: Smoke test
        run: python smoke_test.py

      - name: Persist durable history
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/history)" ]]; then
            echo "No history changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git commit -m "Update package history [skip history]"
          git push origin HEAD:main

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
